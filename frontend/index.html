<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D'auto Traders</title>
    <meta name="description" content="D'auto Traders is an automated trading dashboard for Deriv, providing live signals, trade history, and backtesting for volatility index trading." />
    <link rel="canonical" href="https://www.dautoraders.com/" />
    <meta property="og:title" content="D'auto Traders" />
    <meta property="og:description" content="Automated trading dashboard for Deriv, providing live signals, trade history, and backtesting." />
    <meta property="og:url" content="https://www.dautoraders.com/" />
    <meta property="og:type" content="website" />
    <script>
      // Set the theme before React mounts, so there's no flash of the wrong
      // theme on first paint. Must match useTheme.js's default (dark).
      (function () {
        var stored = localStorage.getItem('theme');
        document.documentElement.setAttribute('data-theme', stored === 'light' ? 'light' : 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
